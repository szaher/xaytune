name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      # CI installs from pyproject.toml, so nothing else would notice a stale
      # lock. It went unnoticed until PR-011 regenerated it.
      - run: uv lock --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev,trl]" --system
      # A skipped TRL test fails the run here (tests/conftest.py), so this job
      # cannot go green having silently tested none of the TRL path.
      - run: python -m pytest tests/ -q --tb=short -m "not slow"
        env:
          XAYTUNE_REQUIRE_TRL: "1"
      # And the suite must exist: pytest exits 5 when nothing is selected.
      - run: python -m pytest tests/ -q --collect-only -m trl

  # The environment a fresh clone gets from `uv sync`: resolved from uv.lock,
  # on the Python .python-version names. The test job installs from
  # pyproject.toml and resolves the newest releases, so it could not notice
  # a lock resolving a release the TRL worker refuses -- which is how the
  # lock came to install transformers 5.9 while CI tested 5.17.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked --extra dev --extra trl
      - run: uv run --locked python -m pytest tests/ -q --tb=short -m "not slow"
        env:
          XAYTUNE_REQUIRE_TRL: "1"
      - run: uv run --locked python -m pytest tests/ -q --collect-only -m trl

  # The package a user installs, not the source tree the tests import. uv
  # builds the sdist, then the wheel from that sdist, so a file the sdist's
  # allow-list leaves out breaks the wheel here rather than on PyPI. The sdist
  # must hold the package and nothing else (scripts/check_sdist.py); the wheel
  # is installed with its declared dependencies into an empty virtualenv on
  # the oldest supported Python and exercised from outside the checkout
  # (scripts/wheel_smoke.py).
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - run: python3 scripts/check_sdist.py dist/*.tar.gz
      # The README is PyPI's long description; metadata or markup PyPI would
      # reject or render wrongly fails here, before any upload is possible.
      - run: uvx twine check --strict dist/*
      - run: uv venv --python 3.10 "$RUNNER_TEMP/smoke"
      # CPU torch: the smoke must not need a GPU, and must not need torch
      # at all -- it asserts nothing imports it -- but installing the declared
      # dependencies is part of what is being checked.
      - run: uv pip install --python "$RUNNER_TEMP/smoke/bin/python" --torch-backend cpu dist/*.whl
      - run: '"$RUNNER_TEMP/smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"'
        working-directory: ${{ runner.temp }}

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev,trl]" --system
      - run: mypy xaytune/ --ignore-missing-imports
