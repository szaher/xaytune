# DPO alignment example
# Usage: trainlib train --config configs/examples/dpo_align.yaml
recipe: align
method: dpo

model:
  name: output/sft-model

data:
  path: data/preferences.jsonl
  format: preference
  eval_split: 0.05

trainer:
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 5e-6
  num_epochs: 1

logging:
  backends: [console, tensorboard]
  project: dpo-align

output:
  dir: output/dpo-aligned
