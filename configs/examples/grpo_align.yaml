# GRPO alignment example (Group Relative Policy Optimization)
# Usage: trainlib train --config configs/examples/grpo_align.yaml
recipe: align
method: grpo

method_params:
  kl_coeff: 0.04

model:
  name: output/sft-model

data:
  path: data/preferences.jsonl
  format: preference
  eval_split: 0.05

trainer:
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 1e-6
  num_epochs: 1

logging:
  backends: [console, tensorboard]
  project: grpo-align

output:
  dir: output/grpo-aligned
