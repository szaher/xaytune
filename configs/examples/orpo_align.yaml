# ORPO alignment example (Odds Ratio Preference Optimization)
# Usage: trainlib train --config configs/examples/orpo_align.yaml
recipe: align
method: orpo

method_params:
  lambda_weight: 1.0

model:
  name: output/sft-model

data:
  path: data/preferences.jsonl
  format: preference
  eval_split: 0.05

trainer:
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 5e-6
  num_epochs: 1

logging:
  backends: [console, tensorboard]
  project: orpo-align

output:
  dir: output/orpo-aligned
