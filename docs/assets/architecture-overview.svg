<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">Xaytune system architecture and implementation boundaries</title>
<desc id="architecture-description">A Python API submits experiments to the experiment control plane; a CLI, Studio and coding-agent interfaces are planned. Inside the control plane, the embedded controller and the durable evaluation lifecycle are implemented, while decisions, policy, budgets and recovery are planned. All of it rests on the implemented domain models, experiment graph and Action records, backed by SQLite aggregates, event/outbox transactions, the RuntimeOperation journal and evaluation records. CandidateSpec passes to trainer compilation (Native and TRL implemented; torchtune and verl planned), TrainingExecutionSpec to capability resolution, and ResolvedExecutionPlan to runtime backends (Local implemented; Ray Train and Training Hub planned). Runtime backends delegate execution to infrastructure and return status, metrics and incidents to the controller. Solid green boxes mark implemented components as of PR-013; dashed boxes mark planned ones.</desc>
