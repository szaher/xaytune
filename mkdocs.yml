site_name: xaytune
site_description: An opinionated LLM training and fine-tuning library
site_url: https://szaher.github.io/xaytune/
repo_url: https://github.com/szaher/xaytune
repo_name: szaher/xaytune

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Recipes:
      - Overview: recipes/index.md
      - Fine-tuning: recipes/finetuning.md
      - Pre-training: recipes/pretraining.md
      - Alignment: recipes/alignment.md
      - Agent Fine-tuning: recipes/agent-finetuning.md
  - API Reference:
      - Overview: api/index.md
      - Recipes: api/recipes.md
      - Data Pipeline: api/data.md
      - Trainer: api/trainer.md
      - Config: api/config.md
      - Callbacks: api/callbacks.md
      - Alignment Losses: api/alignment.md
      - Evaluation: api/evaluation.md
      - Export: api/export.md
  - Training Studio: studio.md
  - Extensibility: extensibility.md
  - CLI Reference: cli.md
  - Examples: examples.md
  - Comparison: comparison.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            docstring_style: google

exclude_docs: |
  superpowers/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/szaher/xaytune
