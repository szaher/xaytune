site_name: trainlib
site_description: An opinionated LLM training and fine-tuning library
site_url: https://szaher.github.io/trainlib/
repo_url: https://github.com/szaher/trainlib
repo_name: szaher/trainlib

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Recipes:
      - Overview: recipes/index.md
      - Fine-tuning: recipes/finetuning.md
      - Pre-training: recipes/pretraining.md
      - Alignment: recipes/alignment.md
  - API Reference:
      - Overview: api/index.md
      - Config: api/config.md
      - Callbacks: api/callbacks.md
      - Evaluation: api/evaluation.md
      - Export: api/export.md
  - CLI Reference: cli.md
  - Examples: examples.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/szaher/trainlib
