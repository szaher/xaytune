[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainlib"
version = "0.1.0"
description = "An opinionated LLM training and fine-tuning library"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "szaher" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.14"]
eval = ["lm-eval>=0.4"]
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
tensorboard = ["tensorboard>=2.14"]
all = [
    "trainlib[deepspeed]",
    "trainlib[eval]",
    "trainlib[wandb]",
    "trainlib[mlflow]",
    "trainlib[tensorboard]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
trainlib = "trainlib.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["examples/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N812"]  # Allow lowercase imports as non-lowercase (e.g., torch.nn.functional as F)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
