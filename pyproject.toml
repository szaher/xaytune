[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xaytune"
version = "1.0.0a1"
description = "Agent-native experiment control plane for model post-training and adaptation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "szaher" },
]
keywords = [
    "llm",
    "fine-tuning",
    "post-training",
    "experiment-control",
    "orchestration",
    "control-plane",
    "trl",
    "evaluation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    # Imported directly: the TRL worker checks installed releases against the
    # ranges it supports (xaytune.workers.trl.verify_versions). 22 is the first
    # release that parses only PEP 440 versions (no LegacyVersion fallback).
    "packaging>=22",
]

[project.urls]
Homepage = "https://github.com/szaher/xaytune"
Documentation = "https://szaher.github.io/xaytune/"
Repository = "https://github.com/szaher/xaytune"
Issues = "https://github.com/szaher/xaytune/issues"

[project.optional-dependencies]
deepspeed = ["deepspeed>=0.14"]
# One minor of each, deliberately. xaytune.workers.trl classifies every
# SFTConfig field and refuses to train on one it has not classified, and
# SFTConfig is TRL's fields on top of transformers' TrainingArguments -- so
# both packages decide what those fields are. A new minor of either is a
# decision to make -- classify what changed, then widen this -- not an upgrade
# that happens to a user. Kept equal to SUPPORTED_VERSIONS in that module,
# which the worker checks before training (tests/test_workers/test_trl_versions.py).
trl = ["trl>=1.13,<1.14", "transformers>=5.17,<5.18"]
eval = ["lm-eval>=0.4"]
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
tensorboard = ["tensorboard>=2.14"]
studio = ["gradio>=5.0", "plotly>=5.0"]
data-prep = ["datasketch>=1.6", "langdetect>=1.0"]
synth = ["openai>=1.0"]
data-all = ["xaytune[data-prep]", "xaytune[synth]"]
all = [
    "xaytune[deepspeed]",
    "xaytune[eval]",
    "xaytune[wandb]",
    "xaytune[mlflow]",
    "xaytune[tensorboard]",
    "xaytune[studio]",
    "xaytune[data-prep]",
    "xaytune[synth]",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "xaytune[docs]",
]

[project.scripts]
xaytune = "xaytune.cli:main"

# The source distribution is an allow-list, not whatever sits in the working
# tree: hatch otherwise packs every file git does not ignore, so a local venv,
# an editor index or a stray database beside the repository would ship to
# PyPI. uv builds the wheel *from* this sdist, and CI checks both
# (scripts/check_sdist.py, scripts/wheel_smoke.py), which is what proves the
# list is complete.
[tool.hatch.build.targets.sdist]
include = [
    "/xaytune",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "examples/**/*.ipynb",
    # Documentation snippets are illustrative; ruff's Markdown code-block
    # formatting adds PEP8 blank lines that hurt readability in docs.
    "**/*.md",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N812"]  # Allow lowercase imports as non-lowercase (e.g., torch.nn.functional as F)

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
