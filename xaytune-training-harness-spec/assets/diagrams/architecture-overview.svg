<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc">
<title id="architecture-overview-title">One control plane. Multiple execution backends.</title>
<desc id="architecture-overview-desc">Clients enter the experiment control plane. CandidateSpec passes to trainer compilers, TrainingExecutionSpec to capability and resilience resolution, and ResolvedExecutionPlan to runtime backends using submit_or_get. Runtime backends delegate to infrastructure. Training Hub is the preferred path to Kubeflow or KubeRay and Kueue.</desc>
<defs><marker id="architecture-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
