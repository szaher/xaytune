<text x="48" y="86" font-size="34" fill="#172b40" font-weight="700" text-anchor="start" class="">One control plane. Multiple execution backends.</text>
<text x="48" y="119" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Experiment intent stays separate from trainer compilation and runtime execution.</text>
