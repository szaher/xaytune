<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="dependency-boundaries-title dependency-boundaries-desc">
<title id="dependency-boundaries-title">Dependencies point toward contracts</title>
<desc id="dependency-boundaries-desc">API depends on experiment orchestration. Experiment orchestration depends on domain and compiler, runtime, evaluation and persistence protocols. Plugins depend on protocols. Core does not import ML runtimes. Direct domain-to-ML, policy-to-TRL, recipe-to-Kubernetes, experiment-to-MLflow and core-to-Training-Hub implementation dependencies are forbidden.</desc>
