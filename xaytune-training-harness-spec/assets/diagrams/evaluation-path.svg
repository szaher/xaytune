<text x="90" y="261" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Subject being measured</text>
<rect x="622" y="158" width="530" height="120" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="642" y="182" width="5" height="72" rx="2" fill="#694bb1" stroke="#694bb1" stroke-width="1.5"/>
<text x="664" y="200" font-size="24" fill="#694bb1" font-weight="700" text-anchor="start" class="">EvaluationSpec</text>
<text x="664" y="232" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Evaluators · dataset · slices</text>
<text x="664" y="261" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Independent EvaluationFingerprint</text>
