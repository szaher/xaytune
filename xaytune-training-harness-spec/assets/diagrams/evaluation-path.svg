<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="evaluation-path-title evaluation-path-desc">
<title id="evaluation-path-title">Evaluation has its own durable lifecycle</title>
<desc id="evaluation-path-desc">ModelArtifact and EvaluationSpec feed evaluator preparation and execution. EvaluationRun owns seed and replicate; EvaluationAttempt records execution and retry. Versioned MetricResult values become EvaluationResult linked to EvaluationRun and the artifact, then DecisionEngine evaluates objective, constraints and uncertainty.</desc>
<defs><marker id="evaluation-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="1200" height="1140" fill="#f5f8fb"/>
<text x="48" y="40" font-size="15" fill="#087f79" font-weight="700" text-anchor="start" class="">XAYTUNE  /  ARCHITECTURE SPECIFICATION</text>
<text x="48" y="86" font-size="34" fill="#172b40" font-weight="700" text-anchor="start" class="">Evaluation has its own durable lifecycle</text>
<text x="48" y="119" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Changing the evaluator does not change candidate identity or require retraining.</text>
