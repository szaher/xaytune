<text x="142" y="394" font-size="24" fill="#694bb1" font-weight="700" text-anchor="start" class="">Prepare evaluation</text>
<text x="142" y="426" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Evaluator.prepare(artifact, spec) → EvaluationExecutionSpec</text>
