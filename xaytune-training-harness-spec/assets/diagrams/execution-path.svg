<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="execution-path-title execution-path-desc">
<title id="execution-path-title">From candidate to runtime workload</title>
<desc id="execution-path-desc">ExperimentNode owns CandidateSpecSnapshot. TrainerCompiler.compile produces TrainingExecutionSpec. CapabilityResolver.resolve and ResilienceProvider.augment produce ResolvedExecutionPlan. Attempt and INTENDED operation are committed before RuntimeBackend.submit_or_get returns RuntimeRef. Status, events, logs and operation lookup support observation and reconciliation.</desc>
<defs><marker id="execution-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="1200" height="1330" fill="#f5f8fb"/>
<text x="48" y="40" font-size="15" fill="#087f79" font-weight="700" text-anchor="start" class="">XAYTUNE  /  ARCHITECTURE SPECIFICATION</text>
<text x="48" y="86" font-size="34" fill="#172b40" font-weight="700" text-anchor="start" class="">From candidate to runtime workload</text>
<text x="48" y="119" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">Serializable contracts cross boundaries; runtime operations retain durable identity.</text>
<rect x="100" y="155" width="1000" height="106" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="179" width="5" height="58" rx="2" fill="#087f79" stroke="#087f79" stroke-width="1.5"/>
<text x="142" y="197" font-size="24" fill="#087f79" font-weight="700" text-anchor="start" class="">01  Declare the candidate</text>
<text x="142" y="229" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">ExperimentNode owns an immutable CandidateSpecSnapshot</text>
<path d="M 600 261 L 600 321" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#execution-path-arrow)"/>
<rect x="454.0" y="274.0" width="292" height="34" rx="4" fill="#f5f8fb" stroke="#f5f8fb" stroke-width="1.5"/>
<text x="600" y="297.0" font-size="18" fill="#52677b" font-weight="400" text-anchor="middle" class="mono">CandidateSpecSnapshot</text>
<rect x="100" y="325" width="1000" height="104" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="349" width="5" height="56" rx="2" fill="#694bb1" stroke="#694bb1" stroke-width="1.5"/>
<text x="142" y="367" font-size="24" fill="#694bb1" font-weight="700" text-anchor="start" class="">02  Compile training intent</text>
<text x="142" y="399" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">TrainerCompiler.compile()</text>
<path d="M 600 429 L 600 489" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#execution-path-arrow)"/>
<rect x="454.0" y="442.0" width="292" height="34" rx="4" fill="#f5f8fb" stroke="#f5f8fb" stroke-width="1.5"/>
<text x="600" y="465.0" font-size="18" fill="#52677b" font-weight="400" text-anchor="middle" class="mono">TrainingExecutionSpec</text>
<rect x="100" y="493" width="1000" height="132" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="517" width="5" height="84" rx="2" fill="#694bb1" stroke="#694bb1" stroke-width="1.5"/>
<text x="142" y="535" font-size="24" fill="#694bb1" font-weight="700" text-anchor="start" class="">03  Resolve execution requirements</text>
<text x="142" y="567" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">CapabilityResolver.resolve()</text>
<text x="142" y="596" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">ResilienceProvider.augment()</text>
<path d="M 600 625 L 600 685" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#execution-path-arrow)"/>
<rect x="454.0" y="638.0" width="292" height="34" rx="4" fill="#f5f8fb" stroke="#f5f8fb" stroke-width="1.5"/>
<text x="600" y="661.0" font-size="18" fill="#52677b" font-weight="400" text-anchor="middle" class="mono">ResolvedExecutionPlan</text>
<rect x="100" y="689" width="1000" height="134" rx="16" fill="#fff8f0" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="713" width="5" height="86" rx="2" fill="#ad591f" stroke="#ad591f" stroke-width="1.5"/>
<text x="142" y="731" font-size="24" fill="#ad591f" font-weight="700" text-anchor="start" class="">04  Commit operation intent</text>
<text x="142" y="763" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">RunAttempt + INTENDED RuntimeOperation + request_digest</text>
<text x="142" y="792" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">One transaction with events and outbox; commit before the runtime call</text>
<path d="M 600 823 L 600 865" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#execution-path-arrow)"/>
<rect x="100" y="869" width="1000" height="110" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="893" width="5" height="62" rx="2" fill="#2567ad" stroke="#2567ad" stroke-width="1.5"/>
<text x="142" y="911" font-size="24" fill="#2567ad" font-weight="700" text-anchor="start" class="">05  Submit or recover the existing operation</text>
<text x="142" y="943" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">RuntimeBackend.submit_or_get(operation_id, plan)</text>
<path d="M 600 979 L 600 1039" fill="none" stroke="#52677b" stroke-width="2" marker-end="url(#execution-path-arrow)"/>
<rect x="465.0" y="992.0" width="270" height="34" rx="4" fill="#f5f8fb" stroke="#f5f8fb" stroke-width="1.5"/>
<text x="600" y="1015.0" font-size="18" fill="#52677b" font-weight="400" text-anchor="middle" class="mono">RuntimeRef</text>
<rect x="100" y="1043" width="1000" height="118" rx="16" fill="white" stroke="#d5e0ea" stroke-width="1.5"/>
<rect x="120" y="1067" width="5" height="70" rx="2" fill="#087f79" stroke="#087f79" stroke-width="1.5"/>
<text x="142" y="1085" font-size="24" fill="#087f79" font-weight="700" text-anchor="start" class="">06  Observe and reconcile</text>
<text x="142" y="1117" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">get_status()  ·  watch()  ·  get_logs()  ·  lookup_operation()</text>
<text x="142" y="1146" font-size="19" fill="#52677b" font-weight="400" text-anchor="start" class="">cancel() records an external effect through the operation journal</text>
<text x="600" y="1210" font-size="23" fill="#087f79" font-weight="700" text-anchor="middle" class="">Same operation ID + same request = the original workload</text>
<text x="600" y="1246" font-size="20" fill="#52677b" font-weight="400" text-anchor="middle" class="">The outbox publishes events; it does not dispatch runtime operations.</text>
<text x="48" y="1306" font-size="14" fill="#52677b" font-weight="400" text-anchor="start" class="">Xaytune 2.0 · Target architecture</text>
<text x="1152" y="1306" font-size="14" fill="#52677b" font-weight="400" text-anchor="end" class="">Contracts and rollout status: see linked specification</text>
</svg>
