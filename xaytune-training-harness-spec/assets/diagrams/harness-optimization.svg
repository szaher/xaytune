<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="harness-optimization-title harness-optimization-desc">
<title id="harness-optimization-title">Agent harness optimization</title>
<desc id="harness-optimization-desc">TrainingCandidate passes through TrainerCompiler and TrainingExecutionSpec. AgentHarnessCandidate passes through HarnessCompiler and AgentExecutionSpec. Both share capability resolution, ResolvedExecutionPlan and RuntimeBackend. The harness loop is candidate, pinned tasks and environment, trajectory, evaluation, planner or search, and a new candidate. Candidate proposals use generic branching governance; actual Actions use PolicyEngine and approval. Both share one controller and experiment graph, separate from capability resolution.</desc>
