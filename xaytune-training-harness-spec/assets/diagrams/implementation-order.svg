<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="implementation-order-title implementation-order-desc">
<title id="implementation-order-title">Build in the order contracts become fixed</title>
<desc id="implementation-order-desc">Bands A through J: domain hardening, transactional persistence, compile/runtime, durable evaluation, action/policy/budget, recovery/interventions, planner/branching, daemon and restart MVP, LLM planner, and platform integrations. ADR-005 is accepted, so Band B is open. The operation journal precedes LocalRuntime; policy precedes recovery.</desc>
