schemaVersion: xaytune.capabilities/v1alpha1

precision:
  supported:
    - fp32
    - fp16
    - bf16

distributed:
  strategies:
    - ddp
    - fsdp
  minWorkers: 1
  maxWorkers: 64

checkpoint:
  formats:
    - torch-dcp
  async: true
  reshardable: true
  atomicCommit: true

elasticity:
  supported: true
  minWorkers: 2
  maxWorkers: 16
  membershipChange: restart

resilience:
  perStep:
    supported: true
    provider: torchft
    providerVersion: ">=0.1"

agentRollout:
  stateful: true
  asynchronous: true

algorithms:
  sft: true
  dpo: true
  grpo: true
