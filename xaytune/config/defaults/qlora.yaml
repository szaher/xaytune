recipe: finetune
method: qlora

model:
  quantization: 4bit

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto

trainer:
  strategy: ddp
  mixed_precision: bf16
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 2e-4
  num_epochs: 3
  weight_decay: 0.01

eval:
  every_n_steps: 500
  metrics: [loss, perplexity]
